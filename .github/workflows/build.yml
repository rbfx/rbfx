name: Build
on:
  push:
    branches-ignore:
      - 'no-ci-**'
      - 'skip-ci-**'
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Run full build'
        required: false
        default: false
        type: boolean

env:
  # common settings
  URHO3D_ENABLE_ALL: ON
  URHO3D_SAMPLES: ON
  URHO3D_TESTING: ON
  URHO3D_PROFILING_FALLBACK: ON
  URHO3D_PRISTINE_FULL_BUILDS: ON
  DOTNET_VERSION: '8.0'
  CMAKE_VERSION: 4.3.x
  # ccache configuration
  ccache_prefix: ${{ secrets.CACHE_VERSION }}-master
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 9
  CCACHE_DEPEND: true
  CCACHE_HARDLINK: true
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_NOHASHDIR: true
  #CCACHE_MAXSIZE: 580M
  CCACHE_LIMIT_MULTIPLE: 0.6
  #CCACHE_DEBUG: 'true'
  #CCACHE_DEBUGDIR: ${{ github.workspace }}/ccache-debug
  # Publish gates. Step-level conditions can use ci_publish directly.
  ci_publish: ${{ github.repository == 'rbfx/rbfx' && github.ref == 'refs/heads/master' }}
  # CI workers have limited capabilities, allow tracy to fall back to less accurate timers.
  TRACY_TIMER_FALLBACK: 1
  SOURCE_REF: ${{ github.head_ref || github.ref_name }}

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PrepareFlags:
    name: Prepare Flags
    runs-on: ubuntu-latest
    outputs:
      ci_publish: ${{ steps.flags.outputs.ci_publish }}
      ci_artifacts: ${{ steps.flags.outputs.ci_artifacts }}
    steps:
      - name: Export workflow flags
        id: flags
        env:
          CI_ARTIFACTS_BRANCHES: ${{ vars.CI_ARTIFACTS_BRANCHES || '' }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          ci_publish=false
          if [[ "$GITHUB_REPOSITORY" == 'rbfx/rbfx' && "$GITHUB_REF" == 'refs/heads/master' ]]; then
            ci_publish=true
          fi

          ci_artifacts=false
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]] && {
            [[ "$HEAD_COMMIT_MESSAGE" == *'#ci-artifacts'* ]] ||
            [[ "$CI_ARTIFACTS_BRANCHES" == 'all' ]] ||
            [[ "$CI_ARTIFACTS_BRANCHES" == *"$GITHUB_REF_NAME"* ]]
          }; then
            ci_artifacts=true
          fi

          printf 'ci_publish=%s\n' "$ci_publish" >> "$GITHUB_OUTPUT"
          printf 'ci_artifacts=%s\n' "$ci_artifacts" >> "$GITHUB_OUTPUT"

  WebHooks:
    name: Web Hooks
    needs: [PrepareFlags]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ needs.PrepareFlags.outputs.ci_publish == 'true' }}
    steps:
      - name: Discord Commits
        uses: rbfx/github_discord_notifier@latest
        with:
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK_COMMITS }}
          github-token: ${{ github.token }}
          action-task: discord-commits
          discord-username: GitHub

  Release-Latest:
    name: Release 'latest'
    needs: [PrepareFlags]
    runs-on: ubuntu-latest
    if: ${{ needs.PrepareFlags.outputs.ci_artifacts == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Create and Push Tag
        run: |
          git tag -f latest
          git push -f origin latest

  PrepareMatrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name != 'rbfx/rbfx') }}
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}

    steps:
      - name: Checkout CI actions
        uses: actions/checkout@v5
        with:
          repository: rbfx/ci
          path: rbfx-ci
          fetch-depth: 1

      - name: Prepare engine matrix
        id: prepare
        uses: ./rbfx-ci/.github/actions/ci-prepare-matrix
        with:
          platforms: all

  Build:
    name: ${{ matrix.ci_job_name }}
    needs: [PrepareFlags, PrepareMatrix]
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name != 'rbfx/rbfx') }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.PrepareMatrix.outputs.matrix) }}

    env:
      ci_platform_tag: ${{ matrix.ci_platform_tag }}
      ci_build_types: ${{ toJSON(matrix.ci_build_types) }}
      ci_artifacts: ${{ needs.PrepareFlags.outputs.ci_artifacts }}
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      BINARYEN_CORES: 1
      ci_workspace_dir: ${{ github.workspace }}
      ci_source_dir: ${{ github.workspace }}
      ci_build_script: ./rbfx-ci/script/ci_build.sh
      ci_artifacts_script: ./rbfx-ci/script/ci_artifacts.sh
      ci_build_dir: ${{ github.workspace }}/rbfx-build/${{ matrix.ci_platform_tag }}
      ci_sdk_dir: ${{ github.workspace }}/SDK/${{ matrix.ci_platform_tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout CI actions
        uses: actions/checkout@v5
        with:
          repository: rbfx/ci
          path: rbfx-ci
          fetch-depth: 1

      - name: Download cached ThirdParty SDK
        id: cached_sdk
        if: ${{ !contains(github.event.head_commit.message || '', '#full-build') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.full_build == 'true') }}
        continue-on-error: true
        shell: bash
        run: |
          ci_hash_thirdparty="$(cmake \
            -DDIRECTORY_PATH="${GITHUB_WORKSPACE}/Source/ThirdParty" \
            -DHASH_FORMAT=short \
            -P "${GITHUB_WORKSPACE}/CMake/Modules/GetThirdPartyHash.cmake" 2>&1)"
          ci_platform_tag="${{ matrix.ci_platform_tag }}" \
          ci_workspace_dir="${GITHUB_WORKSPACE}" \
          ci_hash_thirdparty="$ci_hash_thirdparty" \
            "$ci_artifacts_script" download-cached-sdk

      - name: Sanitize cached ThirdParty SDK
        if: steps.cached_sdk.outputs.sdk_cached == 'true'
        shell: bash
        run: |
          platform_tag="${{ matrix.ci_platform_tag }}"
          ci_platform="${platform_tag%%-*}" \
            "$ci_artifacts_script" sanitize-cached-sdk '${{ github.workspace }}/cached-sdk'

      - name: Prepare shared build context
        id: common
        uses: ./rbfx-ci/.github/actions/ci-prepare-platform
        with:
          profile: engine

      - name: Set up butler
        if: ${{ env.ci_publish == 'true' && vars.DISABLE_ITCH != 'true' }}
        uses: jdno/setup-butler@v1

      - name: Build rbfx SDK configurations
        run: ${{ env.ci_build_script }} build-engine

      - name: Test rbfx SDK configurations (Native)
        if: env.ci_compiler == 'msvc' || env.ci_platform == 'linux'
        run: ${{ env.ci_build_script }} test-engine-native

      - name: Test rbfx SDK configurations (Managed)
        if: env.ci_platform == 'windows' && env.ci_compiler == 'msvc' && env.ci_lib_type == 'dll' && env.ci_arch == 'x64'
        run: ${{ env.ci_build_script }} test-engine-managed

      - name: Copy cached ThirdParty into SDK
        if: steps.cached_sdk.outputs.sdk_cached == 'true' && (env.ci_platform == 'android' || steps.common.outputs.engine_thirdparty_used == 'true')
        run: ${{ env.ci_artifacts_script }} copy-cached-sdk '${{ github.workspace }}/cached-sdk' '${{ env.ci_sdk_dir }}'

      - name: Install rbfx SDK
        run: ${{ env.ci_build_script }} install-engine-sdk

      - name: Save Build Cache
        if: env.ci_artifacts == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.ci_cache_id }}-${{ env.ci_short_sha }}

      - name: Release Mobile Artifacts
        if: env.ci_platform_group == 'mobile' && env.ci_artifacts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ${{ env.ci_artifacts_script }} release-mobile-artifacts

      - name: Deploy to GitHub Pages
        if: env.ci_platform == 'web' && env.ci_publish == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.RBFX_DOCS_DEPLOY_TOKEN }}
          external_repository: rbfx/rbfx.github.io
          destination_dir: samples
          cname: rebelfork.io
          publish_dir: ${{ env.ci_sdk_dir }}/deploy
          publish_branch: master

      - name: Checkout empty-project
        if: env.ci_platform_group != 'mobile'
        id: empty_project_checkout
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: rbfx/empty-project
          path: empty-project
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1
          submodules: true

      - name: Checkout empty-project fallback
        if: env.ci_platform_group != 'mobile' && steps.empty_project_checkout.outcome != 'success'
        uses: actions/checkout@v5
        with:
          repository: rbfx/empty-project
          path: empty-project
          ref: refs/heads/master
          fetch-depth: 1
          submodules: true

      - name: Checkout sample-project
        if: env.ci_platform_group != 'mobile'
        id: sample_project_checkout
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: rbfx/sample-project
          path: sample-project
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1
          submodules: true

      - name: Checkout sample-project fallback
        if: env.ci_platform_group != 'mobile' && steps.sample_project_checkout.outcome != 'success'
        uses: actions/checkout@v5
        with:
          repository: rbfx/sample-project
          path: sample-project
          ref: refs/heads/master
          fetch-depth: 1
          submodules: true

      - name: Test empty-project with SDK
        if: env.ci_platform_group != 'mobile'
        run: ${{ env.ci_build_script }} test-project empty-project sdk

      - name: Test empty-project with engine source
        if: env.ci_platform_group != 'mobile'
        run: ${{ env.ci_build_script }} test-project empty-project source

      - name: Test sample-project with SDK
        if: env.ci_platform_group != 'mobile'
        run: ${{ env.ci_build_script }} test-project sample-project sdk

      - name: Test sample-project with engine source
        if: env.ci_platform_group != 'mobile'
        run: ${{ env.ci_build_script }} test-project sample-project source

      - name: Release SDK
        if: env.ci_artifacts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          archive_name="rebelfork-sdk-${{ env.ci_platform_tag }}-${RELEASE_TAG}"
          archive_dir="$(dirname "$ci_sdk_dir")/${archive_name}"
          mv "$ci_sdk_dir" "$archive_dir"
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on "${archive_name}.7z" "$archive_dir" >/dev/null
          gh release upload "$RELEASE_TAG" "${archive_name}.7z" --repo "$RELEASE_REPOSITORY" --clobber
          mv "$archive_dir" "$ci_sdk_dir"

      - name: Publish to itch.io
        if: ${{ env.ci_publish == 'true' && vars.DISABLE_ITCH != 'true' }}
        run: ${{ env.ci_artifacts_script }} publish-to-itch

      - uses: actions/upload-artifact@v7
        if: ${{ env.CCACHE_DEBUG == 'true' }}
        with:
          name: ccache-debug-build-${{ env.ci_platform_tag }}-${{ github.run_id }}
          path: ${{ env.CCACHE_DEBUGDIR }}
          if-no-files-found: ignore

  Docs:
    runs-on: ubuntu-latest
    needs: [PrepareFlags, Build]
    if: ${{ needs.PrepareFlags.outputs.ci_publish == 'true' }}
    env:
      GH_TOKEN: ${{ secrets.RBFX_DOCS_DEPLOY_TOKEN }}

    steps:
      - name: Trigger
        run: gh workflow run --repo rbfx/rbfx-docs Documentation
