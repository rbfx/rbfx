# Prepares one platform-matrix job for an rbfx engine build or downstream project.
# It centralizes everything that must happen before the actual engine/project build,
# and exports its state through the job environment and the outputs listed below.
#
# Configuration:
# 1. Resolve `ci_platform_tag` into the platform, architecture, compiler, linkage,
#    cache identity, build directories, and other shared CI variables by using
#    `ci_build.sh` from this action's own repository checkout. This keeps action
#    logic pinned to the same repository and ref as the action. Defaults such as
#    CMake/.NET versions and ccache behavior are exported through `GITHUB_ENV`.
# 2. For `downstream`, resolve the caller-provided CMake prefixes. Existing paths
#    are preserved in caller order and missing paths are ignored. Web jobs export
#    them through `CMAKE_FIND_ROOT_PATH`; all other jobs use `CMAKE_PREFIX_PATH`.
#    The action never acquires framework source, SDKs, or project artifacts.
#    For `engine`, the workflow's existing checkout is used as the rbfx source tree.
#
# Toolchain, dependencies, and caches:
# 3. Initialize the selected compiler/toolchain environment. Web jobs shallow-clone
#    and activate emsdk; Android jobs set up Gradle; DLL and Android jobs set up
#    .NET; non-Android jobs install the requested CMake version. Platform-specific
#    dependencies are then installed by `ci_build.sh dependencies`.
# 4. Restore the engine or downstream compiler cache with keys scoped to platform,
#    source revision, and (for downstream jobs) repository. The downstream cache-hit
#    state is exported so ci-build-project knows whether a new cache must be saved.
# 5. Export the resolved downstream CMake prefixes and discover Android Java glue
#    from either source-tree or installed-SDK layouts.
# 6. For non-Android engine jobs, run CMake generation and report whether cached
#    ThirdParty content was reused. The engine build itself remains a workflow step;
#    this action only performs its common pre-build generation.
#
# ci-build-project consumes this prepared state to build a downstream project. The
# caller owns checkout, download, extraction, build waiting, and artifact transfer.
# Keeping preparation separate lets workflows perform those operations explicitly.
name: CI Prepare Platform
description: Shared toolchain, dependency, cache, and CMake-prefix preparation for engine and downstream CI jobs.

inputs:
  profile:
    description: "Workflow profile. Supported values: `engine`, `downstream`."
    required: true
  ci_platform_tag:
    description: "Optional rbfx CI platform tag override. Defaults to `matrix.ci_platform_tag`, then the `ci_platform_tag` environment variable."
    required: false
    default: ''
  project_dir:
    description: "Path to the downstream project root, absolute or relative to `github.workspace`. Required when `profile` is `downstream`."
    required: false
    default: ''
  cmake_prefix_path:
    description: "CMake prefix directories, one per line or as a JSON string array. Relative paths are resolved against `github.workspace`; missing paths are ignored."
    required: false
    default: '[]'
outputs:
  build_cache_hit:
    description: Cache hit state for downstream cache restore.
    value: ${{ steps.build_cache.outputs.cache-hit }}
  engine_thirdparty_used:
    description: Whether engine generate reused cached ThirdParty.
    value: ${{ steps.generate.outputs.thirdparty_used }}
  cmake_prefix_path:
    description: Semicolon-separated existing CMake prefixes in caller order.
    value: ${{ steps.prefixes.outputs.cmake_prefix_path }}

runs:
  using: composite
  steps:
    - name: Initialize CI defaults
      shell: bash
      env:
        INPUT_CI_PLATFORM_TAG: ${{ inputs.ci_platform_tag || matrix.ci_platform_tag || env.ci_platform_tag }}
        INPUT_PROJECT_DIR: ${{ inputs.project_dir }}
        DEFAULT_CCACHE_PREFIX: ${{ inputs.profile == 'downstream' && format('downstream-{0}', github.repository_id) || '' }}
      run: |
        action_repo_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        ci_platform_tag_value="${INPUT_CI_PLATFORM_TAG:-${ci_platform_tag:-}}"
        ci_source_path_value="${ci_source_path:-}"
        ci_source_dir_value="${ci_source_dir:-}"
        ci_build_script_value="${action_repo_root}/script/ci_build.sh"
        ci_sdk_dir_value="${ci_sdk_dir:-${GITHUB_WORKSPACE}/SDK/${ci_platform_tag_value}}"
        project_source_dir_value="${project_source_dir:-}"
        if [[ "${{ inputs.profile }}" == 'downstream' ]]; then
          if [[ -z "$INPUT_PROJECT_DIR" ]]; then
            echo 'Error: project_dir is required for downstream builds.'
            exit 1
          fi
          if [[ "$INPUT_PROJECT_DIR" = /* || "$INPUT_PROJECT_DIR" =~ ^[A-Za-z]:[/\\] ]]; then
            project_source_dir_value="$INPUT_PROJECT_DIR"
          else
            project_source_dir_value="${GITHUB_WORKSPACE}/${INPUT_PROJECT_DIR}"
          fi
          if [[ ! -d "$project_source_dir_value" ]]; then
            echo "Error: project directory does not exist: $project_source_dir_value"
            exit 1
          fi

          ci_source_path_value='.'
          ci_source_dir_value="$action_repo_root"
        else
          project_source_dir_value="${project_source_dir_value:-${GITHUB_WORKSPACE}}"
          if [[ -z "$ci_source_path_value" ]]; then
            ci_source_path_value='.'
          fi
          if [[ -z "$ci_source_dir_value" ]]; then
            ci_source_dir_value="${GITHUB_WORKSPACE}/${ci_source_path_value}"
          fi
        fi

        {
          printf 'DOTNET_VERSION=%s\n' "${DOTNET_VERSION:-8.0}"
          printf 'CMAKE_VERSION=%s\n' "${CMAKE_VERSION:-4.3.x}"
          printf 'BINARYEN_CORES=%s\n' "${BINARYEN_CORES:-1}"
          printf 'TRACY_TIMER_FALLBACK=%s\n' "${TRACY_TIMER_FALLBACK:-1}"
          printf 'CCACHE_DIR=%s\n' "${CCACHE_DIR:-${GITHUB_WORKSPACE}/.ccache}"
          printf 'CCACHE_COMPRESS=%s\n' "${CCACHE_COMPRESS:-true}"
          printf 'CCACHE_COMPRESSLEVEL=%s\n' "${CCACHE_COMPRESSLEVEL:-9}"
          printf 'CCACHE_DEPEND=%s\n' "${CCACHE_DEPEND:-true}"
          printf 'CCACHE_HARDLINK=%s\n' "${CCACHE_HARDLINK:-true}"
          printf 'CCACHE_SLOPPINESS=%s\n' "${CCACHE_SLOPPINESS:-pch_defines,time_macros,include_file_mtime,include_file_ctime}"
          printf 'CCACHE_NOHASHDIR=%s\n' "${CCACHE_NOHASHDIR:-true}"
          printf 'CCACHE_LIMIT_MULTIPLE=%s\n' "${CCACHE_LIMIT_MULTIPLE:-0.6}"
          printf 'ccache_prefix=%s\n' "${ccache_prefix:-${DEFAULT_CCACHE_PREFIX}}"
          printf 'ci_platform_tag=%s\n' "$ci_platform_tag_value"
          printf 'ci_workspace_dir=%s\n' "${ci_workspace_dir:-${GITHUB_WORKSPACE}}"
          printf 'ci_source_path=%s\n' "$ci_source_path_value"
          printf 'ci_source_dir=%s\n' "$ci_source_dir_value"
          printf 'ci_build_script=%s\n' "$ci_build_script_value"
          printf 'ci_build_dir=%s\n' "${ci_build_dir:-${GITHUB_WORKSPACE}/rbfx-build/${ci_platform_tag_value}}"
          printf 'ci_sdk_dir=%s\n' "$ci_sdk_dir_value"
          printf 'project_source_dir=%s\n' "$project_source_dir_value"
          printf 'project_build_dir=%s\n' "${project_build_dir:-${GITHUB_WORKSPACE}/project-build/${ci_platform_tag_value}}"
        } >> "$GITHUB_ENV"

    - name: Setup environment
      shell: bash
      run: |
        "$ci_build_script" setup-environment

    - name: Checkout emsdk
      if: env.ci_platform == 'web'
      uses: actions/checkout@v5
      with:
        repository: emscripten-core/emsdk
        path: emsdk
        fetch-depth: 1

    - name: Setup emsdk
      if: env.ci_platform == 'web'
      shell: bash
      run: |
        "$ci_build_script" setup-emsdk

    - name: Restore build cache
      if: inputs.profile == 'engine'
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR || format('{0}/.ccache', github.workspace) }}
        key: ${{ env.ci_cache_id }}-${{ env.ci_short_sha }}
        restore-keys: |
          ${{ env.ci_cache_id }}

    - name: Restore build cache
      if: inputs.profile == 'downstream'
      id: build_cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR || format('{0}/.ccache', github.workspace) }}
        key: ${{ env.ci_cache_id }}-${{ github.sha }}
        restore-keys: |
          ${{ env.ci_cache_id }}-
          downstream-${{ github.repository_id }}-${{ env.ci_platform_tag }}-

    - name: Setup dotnet
      if: env.ci_lib_type == 'dll' || env.ci_platform == 'android'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION || '8.0' }}

    - name: Setup Gradle
      if: env.ci_platform == 'android'
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.14.3'
        add-job-summary: 'never'

    - name: Setup cmake
      if: env.ci_platform != 'android'
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: ${{ env.CMAKE_VERSION || '4.3.x' }}

    - name: Dependencies
      shell: bash
      run: |
        "$ci_build_script" dependencies

    - name: Resolve CMake prefix path
      id: prefixes
      if: inputs.profile == 'downstream'
      shell: bash
      env:
        INPUT_CMAKE_PREFIX_PATH: ${{ inputs.cmake_prefix_path }}
        INPUT_WORKSPACE_DIR: ${{ github.workspace }}
      run: |
        "$ci_build_script" resolve-cmake-prefix-path

    - name: Build swig
      if: >-
        inputs.profile == 'engine' &&
        ((env.ci_lib_type == 'dll' && env.ci_platform_group != 'desktop') || env.ci_platform == 'ios')
      shell: bash
      run: |
        "$ci_build_script" build-swig

    - name: Setup PackageTool
      if: inputs.profile == 'engine' && env.ci_platform_group != 'desktop'
      shell: bash
      run: |
        "$ci_build_script" setup-package-tool

    - name: Generate
      id: generate
      if: inputs.profile == 'engine' && env.ci_platform != 'android'
      shell: bash
      run: |
        "$ci_build_script" generate-detect-thirdparty --auto-pch true

    - name: Export downstream build state
      if: inputs.profile == 'downstream'
      shell: bash
      run: |
        {
          printf 'ci_build_cache_hit=%s\n' "${{ steps.build_cache.outputs.cache-hit }}"
        } >> "$GITHUB_ENV"
